joint_group_position_controller:
  type: effort_controllers/JointGroupPositionController
  joints: [
    $(arg arm_id)_joint1,
    $(arg arm_id)_joint2,
    $(arg arm_id)_joint3,
    $(arg arm_id)_joint4,
    $(arg arm_id)_joint5,
    $(arg arm_id)_joint6,
    $(arg arm_id)_joint7
  ]

  # My PIDs
  $(arg arm_id)_joint1:
    pid: {p: 200.0, i: 0.0, d: 30.0}
  $(arg arm_id)_joint2:
    pid: {p: 200.0, i: 0.0, d: 30.0}
  $(arg arm_id)_joint3:
    pid: {p: 200.0, i: 0.0, d: 30.0}
  $(arg arm_id)_joint4:
