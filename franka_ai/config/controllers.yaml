    pid: {p: 200.0, i: 0.0, d: 30.0}
  $(arg arm_id)_joint6:
    pid: {p: 200.0, i: 0.0, d: 30.0}
  $(arg arm_id)_joint7:
    pid: {p: 10.0, i: 0.0, d: 1.0}

